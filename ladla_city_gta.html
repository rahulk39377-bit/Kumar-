<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LADLA City – GTA Style Open World</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a1a;font-family:Arial,Helvetica,sans-serif;touch-action:none}
canvas{display:block;position:absolute;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;z-index:10}
.top{position:absolute;top:12px;display:flex;gap:10px}
.left{left:12px}.right{right:12px}
.panel{background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 14px;backdrop-filter:blur(6px)}
.money{font-size:22px;font-weight:800;color:#4ade80}
.wanted{color:#f87171;font-weight:700}
.objective{position:absolute;left:12px;top:90px;background:rgba(0,0,0,.8);border-radius:10px;padding:12px 16px;width:240px;border-left:4px solid #facc15}
.objective b{color:#facc15}
.side{position:absolute;right:12px;top:100px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.side button,.bottom button,#controls button{border:0;background:rgba(15,15,20,.85);color:#fff;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px)}
.side button:active{transform:scale(.95)}
#controls{position:absolute;bottom:90px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:auto}
.circle{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.55);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center}
#bottomNav{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(8,10,15,.92);padding:10px 12px;border-radius:18px 18px 0 0;pointer-events:auto}
#bottomNav button{min-width:70px;font-size:11px;padding:8px 6px}
.modal{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,92vw);background:rgba(10,12,18,.96);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:20px;pointer-events:auto;z-index:50}
.modal h2{margin:0 0 12px;font-size:20px}
.product{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#1a1e28;border-radius:10px;margin:8px 0}
.buy{background:#22c55e;border:0;color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.close{float:right;background:#333;color:#fff;border:0;border-radius:8px;padding:5px 10px;cursor:pointer}
#minimap{position:absolute;bottom:100px;right:14px;width:140px;height:140px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);overflow:hidden}
#minimap canvas{width:100%;height:100%}
.speedo{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:800;text-shadow:0 2px 8px #000;opacity:.9}
.msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);padding:16px 28px;border-radius:12px;font-size:18px;font-weight:700;display:none;z-index:40}
</style>
</head>
<body>
<div id="hud">
  <div class="top left">
    <div class="panel"><b>🏍️ LADLA CITY</b><br><small>GTA Style Open World</small></div>
    <div class="panel">
      💰 <span class="money">₹<span id="money">45000</span></span><br>
      ⭐ <span id="score">1850</span> &nbsp; LEVEL <span id="level">7</span>
      <div id="wanted" class="wanted" style="display:none">★ WANTED ★</div>
    </div>
  </div>
  <div class="objective" id="objBox"><b>OBJECTIVE</b><br><span id="objText">Reach LADLA BAZAR</span></div>
  <div class="top right"><div class="panel">📶 ONLINE<br><small>City Server</small></div></div>
  <div class="side">
    <button onclick="openModal('phone')">📞 PHONE</button>
    <button onclick="openModal('map')">📍 MAP</button>
    <button onclick="toggleVehicle()">🚗 ENTER / EXIT</button>
    <button onclick="openModal('garage')">🏠 GARAGE</button>
  </div>
  <div id="controls">
    <div>
      <button class="circle" data-key="a">◀</button>
      <button class="circle" data-key="d">▶</button>
    </div>
    <div>
      <button class="circle" data-key="s">🛑</button>
      <button class="circle" data-key="w">⚡</button>
    </div>
  </div>
  <div id="bottomNav">
    <button onclick="openModal('home')">⌂<br>HOME</button>
    <button onclick="openModal('missions')">☑<br>MISSIONS</button>
    <button onclick="openModal('bazar')">🛒<br>BAZAR</button>
    <button onclick="openModal('garage')">⌂<br>GARAGE</button>
    <button onclick="openModal('profile')">●<br>PROFILE</button>
  </div>
  <div id="minimap"><canvas id="mmap"></canvas></div>
  <div class="speedo"><span id="spd">0</span> km/h</div>
  <div class="modal" id="modal"></div>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ========== LADLA CITY – GTA-style Open World ========== */
let scene, camera, renderer, player, keys = {}, money = 45000, score = 1850, level = 7;
let speed = 0, inVehicle = false, currentVehicle = null, wanted = 0, wantedTimer = 0;
let buildings = [], cars = [], trees = [], lights = [], marketPos = new THREE.Vector3(85,0,-70);
let missions = [
  {id:1, name:"Go to LADLA BAZAR", reward:800, done:false, pos:marketPos},
  {id:2, name:"Deliver package to North Block", reward:1200, done:false, pos:new THREE.Vector3(-90,0,110)},
  {id:3, name:"Win street race", reward:2500, done:false, pos:new THREE.Vector3(0,0,-160)},
  {id:4, name:"Steal the red car", reward:1800, done:false, pos:new THREE.Vector3(40,0,60)}
];
let activeMission = 0;
const MAP_SIZE = 600;

const modal = document.getElementById('modal');
const msgEl = document.getElementById('msg');

function showMsg(t, ms=2200){
  msgEl.textContent = t; msgEl.style.display='block';
  setTimeout(()=>msgEl.style.display='none', ms);
}

function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87b8df);
  scene.fog = new THREE.Fog(0x87b8df, 80, 380);

  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 600);
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
  renderer.shadowMap.enabled = true;
  document.body.prepend(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 1.4));
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.8);
  sun.position.set(80, 120, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  scene.add(sun);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE),
    new THREE.MeshStandardMaterial({color:0x4a7c3f, roughness:0.9})
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  createRoad(0,0, MAP_SIZE, 18);
  createRoad(0,0, 18, MAP_SIZE);
  createRoad(-120,0, MAP_SIZE*0.7, 14);
  createRoad(120,0, MAP_SIZE*0.7, 14);
  createRoad(0,-120, 14, MAP_SIZE*0.7);
  createRoad(0,120, 14, MAP_SIZE*0.7);
  createRoad(-60,60, 200, 12);
  createRoad(60,-60, 200, 12);

  buildCity();
  addStreetLights();
  addTrees();
  spawnCars();
  addMarket();

  player = makeBike();
  player.position.set(0, 0.9, 40);
  scene.add(player);

  document.querySelectorAll('[data-key]').forEach(b=>{
    const k = b.dataset.key;
    b.onpointerdown = e=>{ e.preventDefault(); keys[k]=1; };
    b.onpointerup = b.onpointercancel = ()=> keys[k]=0;
  });
  addEventListener('keydown', e=> keys[e.key.toLowerCase()]=1);
  addEventListener('keyup', e=> keys[e.key.toLowerCase()]=0);
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  initMinimap();
  showMsg("Welcome to LADLA CITY – Explore freely!", 3000);
  animate();
}

function createRoad(x,z,w,d){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.08, d),
    new THREE.MeshStandardMaterial({color:0x33383f, roughness:0.85})
  );
  m.position.set(x, 0.04, z);
  m.receiveShadow = true;
  scene.add(m);
  if(w > d){
    const line = new THREE.Mesh(new THREE.BoxGeometry(w*0.9,0.09,0.4), new THREE.MeshBasicMaterial({color:0xf5d76e}));
    line.position.set(x,0.05,z);
    scene.add(line);
  } else {
    const line = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.09,d*0.9), new THREE.MeshBasicMaterial({color:0xf5d76e}));
    line.position.set(x,0.05,z);
    scene.add(line);
  }
}

function building(x,z,w,d,h,col){
  const mat = new THREE.MeshStandardMaterial({
    color: col || [0xc9a87c,0xb0b8c0,0x8b7a65,0x6a7a8a,0xd4c4a8][Math.floor(Math.random()*5)],
    roughness:0.75
  });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x, h/2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  buildings.push(m);
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w*0.92, 0.4, d*0.92),
    new THREE.MeshStandardMaterial({color:0x4a2f22})
  );
  roof.position.set(x, h+0.2, z);
  scene.add(roof);
}

function buildCity(){
  for(let i=-200; i<=200; i+=32){
    for(let j=-200; j<=200; j+=32){
      if(Math.abs(i)<28 && Math.abs(j)<28) continue;
      if(Math.random() < 0.55){
        const h = 8 + Math.random()*28;
        building(i + (Math.random()-0.5)*6, j + (Math.random()-0.5)*6, 12+Math.random()*10, 12+Math.random()*10, h);
      }
    }
  }
  for(let i=0;i<18;i++){
    const x = (Math.random()-0.5)*380;
    const z = (Math.random()-0.5)*380;
    if(Math.hypot(x,z)<60) continue;
    building(x, z, 18+Math.random()*14, 18+Math.random()*14, 35+Math.random()*55, 0x6a7a8a);
  }
}

function addStreetLights(){
  for(let z=-250; z<=250; z+=40){
    for(let side of [-12,12]){
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,7,6), new THREE.MeshStandardMaterial({color:0x333}));
      pole.position.set(side, 3.5, z);
      scene.add(pole);
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.35,8,8), new THREE.MeshBasicMaterial({color:0xffe9a8}));
      lamp.position.set(side, 7, z);
      scene.add(lamp);
    }
  }
}

function addTrees(){
  for(let i=0;i<90;i++){
    const x = (Math.random()-0.5)*MAP_SIZE*0.9;
    const z = (Math.random()-0.5)*MAP_SIZE*0.9;
    if(Math.abs(x)<25 || Math.abs(z)<25) continue;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,3,6), new THREE.MeshStandardMaterial({color:0x5c3a21}));
    trunk.position.set(x,1.5,z);
    scene.add(trunk);
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.2,8,8), new THREE.MeshStandardMaterial({color:0x2d6a2d}));
    leaves.position.set(x,4.2,z);
    scene.add(leaves);
  }
}

function makeBike(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.05,0.55,2.2), new THREE.MeshStandardMaterial({color:0x111316, metalness:0.6, roughness:0.3}));
  g.add(body);
  const red = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.22,0.8), new THREE.MeshStandardMaterial({color:0xc41e2a}));
  red.position.set(0,0.25,-0.2);
  g.add(red);
  [-0.85,0.85].forEach(z=>{
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.22,16), new THREE.MeshStandardMaterial({color:0x111}));
    w.rotation.z = Math.PI/2;
    w.position.z = z;
    g.add(w);
  });
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.16,0.08), new THREE.MeshBasicMaterial({color:0xffffff}));
  head.position.set(0,0.22,-1.15);
  g.add(head);
  g.userData = {type:'bike', maxSpeed:0.55, turn:0.05};
  return g;
}

function makeCar(color){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.1,0.7,4.2), new THREE.MeshStandardMaterial({color:color||0x1e3a8a, metalness:0.4, roughness:0.4}));
  body.position.y = 0.55;
  g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.9,0.65,2.2), new THREE.MeshStandardMaterial({color:0x222, metalness:0.3}));
  cabin.position.set(0,1.1,-0.2);
  g.add(cabin);
  [[-0.85,-1.3],[0.85,-1.3],[-0.85,1.3],[0.85,1.3]].forEach(([x,z])=>{
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.28,12), new THREE.MeshStandardMaterial({color:0x111}));
    w.rotation.z = Math.PI/2;
    w.position.set(x,0.38,z);
    g.add(w);
  });
  g.userData = {type:'car', maxSpeed:0.72, turn:0.035, color};
  return g;
}

function spawnCars(){
  const colors = [0xe11d48,0xf8fafc,0x1e293b,0x2563eb,0x16a34a,0xf59e0b,0x7c3aed];
  for(let i=0;i<22;i++){
    const car = makeCar(colors[i%colors.length]);
    const side = i%2 ? 8 : -8;
    car.position.set(side + (Math.random()-0.5)*4, 0, -220 + i*28 + Math.random()*10);
    car.rotation.y = Math.random()>0.5 ? 0 : Math.PI;
    scene.add(car);
    cars.push(car);
  }
  for(let i=0;i<12;i++){
    const car = makeCar(colors[Math.floor(Math.random()*colors.length)]);
    car.position.set((Math.random()-0.5)*300, 0, (Math.random()-0.5)*300);
    car.rotation.y = Math.random()*Math.PI*2;
    scene.add(car);
    cars.push(car);
  }
}

function addMarket(){
  const m = new THREE.Mesh(new THREE.BoxGeometry(22,9,14), new THREE.MeshStandardMaterial({color:0x1f2937}));
  m.position.set(85,4.5,-70);
  scene.add(m);
  const sign = new THREE.Mesh(new THREE.BoxGeometry(20,1.2,0.5), new THREE.MeshBasicMaterial({color:0xf59e0b}));
  sign.position.set(85,9.5,-77);
  scene.add(sign);
  const flag = new THREE.Mesh(new THREE.BoxGeometry(1,4,0.2), new THREE.MeshBasicMaterial({color:0xef4444}));
  flag.position.set(96,6,-70);
  scene.add(flag);
}

function toggleVehicle(){
  if(inVehicle){
    player.visible = true;
    player.position.copy(currentVehicle.position);
    player.position.y = 0.9;
    player.rotation.y = currentVehicle.rotation.y;
    currentVehicle = null;
    inVehicle = false;
    showMsg("Exited vehicle");
  } else {
    let nearest = null, dist = 9;
    cars.forEach(c=>{
      const d = player.position.distanceTo(c.position);
      if(d < dist){ dist=d; nearest=c; }
    });
    if(nearest){
      currentVehicle = nearest;
      inVehicle = true;
      player.visible = false;
      showMsg("Entered " + (nearest.userData.color===0xe11d48 ? "RED CAR" : "vehicle"));
      if(nearest.userData.color===0xe11d48 && !missions[3].done){
        completeMission(3);
      }
    } else {
      showMsg("No vehicle nearby");
    }
  }
}

function openModal(type){
  const content = {
    home: ['LADLA CITY','Open-world GTA-style city. Ride, drive, complete missions, buy upgrades and explore the huge map.'],
    missions: ['MISSIONS', missions.map(m=> (m.done?'✅ ':'🏁 ')+m.name+' — ₹'+m.reward).join('<br>')],
    bazar: ['LADLA BAZAR',`
      <div class="product">Anar RTR 200 <b>₹95,000</b><button class="buy" onclick="buy(95000,'bike')">BUY</button></div>
      <div class="product">Sports Car <b>₹2,80,000</b><button class="buy" onclick="buy(280000,'car')">BUY</button></div>
      <div class="product">Gaming Laptop <b>₹75,000</b><button class="buy" onclick="buy(75000)">BUY</button></div>
      <div class="product">Sell items <button class="buy" onclick="sell()">SELL +₹400</button></div>`],
    garage: ['GARAGE','Current: '+(inVehicle?'Car':'LADLA Bike')+'<br><br>Upgrades coming: Engine • Nitro • Paint • Armor'],
    profile: ['PROFILE','👤 LADLA Player<br>Level '+level+'<br>Money ₹'+money.toLocaleString()+'<br>Score '+Math.floor(score)],
    map: ['CITY MAP','🟢 You<br>🟡 Active Mission<br>🔵 LADLA Bazar<br>🔴 Wanted zones<br><br>Map size: '+MAP_SIZE+'×'+MAP_SIZE],
    phone: ['PHONE','📞 Contacts<br>🏁 Mission Center<br>🛒 LADLA BAZAR<br>🚔 Police (wanted system active)']
  };
  modal.innerHTML = `<button class="close" onclick="modal.style.display='none'">✕</button>
    <h2>${content[type][0]}</h2><div>${content[type][1]}</div>`;
  modal.style.display = 'block';
}

function buy(p, item){
  if(money >= p){
    money -= p;
    document.getElementById('money').textContent = money.toLocaleString();
    showMsg('Purchase successful!');
    if(item==='car'){
      const c = makeCar(0x16a34a);
      c.position.copy(player.position);
      c.position.x += 5;
      scene.add(c);
      cars.push(c);
      showMsg('Sports car delivered nearby!');
    }
  } else showMsg('Not enough money!');
}

function sell(){
  money += 400;
  document.getElementById('money').textContent = money.toLocaleString();
  showMsg('Sold! +₹400');
}

function completeMission(idx){
  if(missions[idx].done) return;
  missions[idx].done = true;
  money += missions[idx].reward;
  score += missions[idx].reward/2;
  document.getElementById('money').textContent = money.toLocaleString();
  document.getElementById('score').textContent = Math.floor(score);
  showMsg('Mission Complete! +₹'+missions[idx].reward, 3000);
  const next = missions.find(m=>!m.done);
  if(next){
    activeMission = missions.indexOf(next);
    document.getElementById('objText').textContent = next.name;
  } else {
    document.getElementById('objText').textContent = 'All missions done! Explore freely';
  }
}

function checkMissions(){
  const pos = inVehicle ? currentVehicle.position : player.position;
  const m = missions[activeMission];
  if(m && !m.done && pos.distanceTo(m.pos) < 18){
    completeMission(activeMission);
  }
}

let mmapCtx;
function initMinimap(){
  const c = document.getElementById('mmap');
  c.width = 140; c.height = 140;
  mmapCtx = c.getContext('2d');
}
function drawMinimap(){
  if(!mmapCtx) return;
  const ctx = mmapCtx;
  ctx.fillStyle = '#1a2f1a';
  ctx.fillRect(0,0,140,140);
  ctx.fillStyle = '#444';
  ctx.fillRect(0,66,140,8);
  ctx.fillRect(66,0,8,140);
  const p = inVehicle ? currentVehicle : player;
  const sx = 70 + p.position.x * 0.22;
  const sy = 70 + p.position.z * 0.22;
  ctx.fillStyle = '#4ade80';
  ctx.beginPath(); ctx.arc(sx,sy,5,0,6.3); ctx.fill();
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(70+85*0.22-3, 70-70*0.22-3, 6,6);
  const m = missions[activeMission];
  if(m && !m.done){
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(70+m.pos.x*0.22, 70+m.pos.z*0.22, 4,0,6.3);
    ctx.fill();
  }
}

function animate(){
  requestAnimationFrame(animate);

  const ent = inVehicle ? currentVehicle : player;
  const maxSp = ent.userData.maxSpeed || 0.5;
  const turnRate = ent.userData.turn || 0.045;

  let targetSpeed = 0;
  if(keys.w) targetSpeed = maxSp;
  if(keys.s) targetSpeed = -maxSp * 0.45;
  speed += (targetSpeed - speed) * 0.12;

  if(keys.a) ent.rotation.y += turnRate * (speed>0?1:-1);
  if(keys.d) ent.rotation.y -= turnRate * (speed>0?1:-1);

  ent.translateZ(-speed);

  ent.position.x = Math.max(-MAP_SIZE/2+5, Math.min(MAP_SIZE/2-5, ent.position.x));
  ent.position.z = Math.max(-MAP_SIZE/2+5, Math.min(MAP_SIZE/2-5, ent.position.z));

  score += Math.abs(speed) * 0.12;
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('spd').textContent = Math.abs(Math.floor(speed*180));

  if(Math.abs(speed) > 0.45 && Math.random()<0.002){
    wanted = Math.min(5, wanted+1);
    wantedTimer = 600;
  }
  if(wantedTimer>0){ wantedTimer--; if(wantedTimer<=0) wanted=0; }
  document.getElementById('wanted').style.display = wanted>0 ? 'block' : 'none';

  const offset = new THREE.Vector3(0, 6.5, 11);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0), ent.rotation.y);
  const targetCam = ent.position.clone().add(offset);
  camera.position.lerp(targetCam, 0.08);
  camera.lookAt(ent.position.x, ent.position.y+1.2, ent.position.z);

  checkMissions();
  drawMinimap();

  cars.forEach((c,i)=>{
    if(c === currentVehicle) return;
    if(i%3===0){
      c.translateZ(-0.08);
      if(Math.abs(c.position.z)>280) c.position.z *= -0.9;
    }
  });

  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
